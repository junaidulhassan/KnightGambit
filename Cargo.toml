[package]
name = "knightgambit"
version = "1.0.4"
edition = "2024"
rust-version = "1.85"
description = "KnightGambit - premium offline chess for the GNOME desktop"
license = "GPL-3.0-or-later"
authors = ["Junaid Ul Hassan"]
readme = "README.md"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
shakmaty = { version = "0.30", features = ["std"] }
pgn-reader = "0.29"
resvg = { version = "0.49", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.11"
rand = "0.9"

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
